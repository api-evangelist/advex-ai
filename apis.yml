aid: advex-ai
name: Advex AI
description: >-
  Advex AI (Advex AI, Inc., San Francisco / Pleasanton, California; founded 2022 by Pedro Pachuca
  and Qasim Wani) builds generative-AI synthetic data and self-healing computer vision for industrial
  quality inspection. Its flagship product, Composer, is a no-code AI vision system that lets
  manufacturing and logistics teams train, deploy and manage visual inspection tasks — defect and
  anomaly detection, pick-and-place, kitting and assembly verification, counting — from a handful of
  real images, using diffusion models to synthesize the missing training data and VLMs to run the
  inspection. Composer is sold as an on-premises appliance (the "Advex box") paired with plant
  cameras and is explicitly designed to run entirely on-device without network connectivity. The
  company raised a $3.5M seed round in November 2024 led by Construct Capital with Pear VC and
  Emerson Collective. As of this profile Advex publishes no public API, developer portal, SDK or
  machine-readable specification of any kind, and its own website is currently unpublished.
